[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "afrip"
version = "0.1.0"
description = "Advanced Framework for Radar Information Processing"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "PyYAML>=6.0",
    "numpy>=1.20",
    "torch>=1.9",
    "scipy>=1.7",
    "matplotlib>=3.3",
    "opencv-python>=4.5",
    "torchvision>=0.10",
    "h5py>=3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=5.4",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
