_base_:
  - ../../base/runtime.yaml
  - ../../datasets/radar_detection_sample.yaml
  - ../../detectors/yolortv2_resnet18.yaml
  - ../../trackers/kalman_sort.yaml
  - ../../strategies/detection_baseline.yaml

experiment:
  name: radardet_yolortv2_sort
  stage: detection_with_tracking_eval

runtime:
  work_dir: outputs/radardet_yolortv2_sort

strategy:
  optimizer:
    lr0: 0.0001
  train:
    eval_interval: 1
    num_workers_train: 4
  eval:
    save_folder: outputs/radardet_yolortv2_sort/weights
  vis_pred_full: false

deterministic: true