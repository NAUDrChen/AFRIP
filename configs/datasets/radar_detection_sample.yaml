dataset:
  type: RadarWindowDataset
  mat_dir: D:\Data\JHT\data
  csv_path: D:\Data\JHT\data\data_mat.csv
  window_size: [640, 640]
  stride: [320, 320]
  complex_mode: abs
  subset: train
  azimuth_split_ratio: 0.7
  cache_mat_files: 4
  filter_difficult: false
  class_mapping:              # 对应旧版 DataConfig.class_mapping
    mt: 0
    wm: 1
    uk: 2

dataloader:
  batch_size: 16
  shuffle: false

train_transforms:
  - type: SeaClutterInjection
    prob: 0.7
    snr_db_range: [5.0, 20.0]
    background_only: false
  - type: RandomVerticalFlip
    prob: 0.5
  - type: AmplitudeNormalize
    mode: db_percentile
  - type: PadToStride
    stride: 32

val_transforms:
  - type: AmplitudeNormalize
    mode: db_percentile