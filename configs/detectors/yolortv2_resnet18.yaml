detector:
  type: ConfigurableDetectionModel
  num_classes: 3
  conf_thresh: 0.01
  nms_thresh: 0.5
  nms_type: hard
  soft_nms_method: linear
  soft_nms_sigma: 0.5
  soft_nms_score_thresh: 0.001
  topk: null
  preprocessor_cfg:
    type: TensorPreprocessor
  postprocessor_cfg:
    type: YOLOObjectnessPostprocessor
    conf_thresh: 0.01
    nms_thresh: 0.5
    nms_type: hard
    soft_nms_method: linear
    soft_nms_sigma: 0.5
    soft_nms_score_thresh: 0.001
    topk: null
    class_agnostic: true
    num_classes: 1
  trainable: false
  deploy: false
  backbone_cfg:
    type: ResNet18Pyramid
    in_channels: 1
    pretrained: false
    pretrained_path: null
  component_cfgs:
    neck_main:
      builder: neck
      type: SPPF
      in_dim: 256
      out_dim: 512
      expand_ratio: 0.5
      pooling_size: 5
      act_type: lrelu
      norm_type: BN
    p2_lateral:
      builder: common
      type: ConvBlock
      in_channels: 128
      out_channels: 512
      k: 1
      p: 0
      s: 1
      act_type: lrelu
      norm_type: BN
    p2_fuse:
      builder: common
      type: ConvBlock
      in_channels: 1024
      out_channels: 512
      k: 3
      p: 1
      s: 1
      act_type: lrelu
      norm_type: BN
    head_shared:
      builder: head
      type: DecoupledHead
      in_dim: 512
      out_dim: 512
      num_classes: 3
      num_cls_head: 2
      num_reg_head: 2
      act_type: lrelu
      norm_type: BN
      depthwise: false
  feature_nodes:
    - name: c3
      source:
        type: backbone
        index: 0
    - name: c4
      source:
        type: backbone
        index: 1
    - name: p3
      source:
        type: node
        ref: c4
      ops:
        - type: component
          ref: neck_main
    - name: p2_lat
      source:
        type: node
        ref: c3
      ops:
        - type: component
          ref: p2_lateral
    - name: p3_up
      source:
        type: node
        ref: p3
      ops:
        - type: interpolate
          like: p2_lat
          mode: nearest
    - name: p2
      source:
        type: nodes
        refs: [p2_lat, p3_up]
      ops:
        - type: concat
          dim: 1
        - type: component
          ref: p2_fuse
  prediction_levels:
    - name: p2
      feature: p2
      stride: 8
      head_ref: head_shared
    - name: p3
      feature: p3
      stride: 16
      head_ref: head_shared

loss:
  type: YoloRTv2Criterion
  num_classes: 3
  loss_obj_weight: 1.0
  loss_box_weight: 5.0
  loss_obj_empty_factor: 0.25
  assigner: simota
  assign_radius: 1
  assign_use_inbox: false
  assign_area_weight: 0.05
  assign_force_one: true
  assign_force_max_radius: 6
  assign_force_level: 0
  matcher_cfg:
    type: SimOTAMatcher
    topk: 10
    center_radius: 2.5
    iou_weight: 3.0
    cls_weight: 1.0
    use_inbox: true
    use_center: true
    force_one: true
    force_level: 0