detector:
  type: DetectionModel
  num_classes: 3
  preprocessor_cfg:
    type: TensorPreprocessor
  postprocessor_cfg:
    type: YOLOObjectnessPostprocessor
    conf_thresh: 0.01
    nms_thresh: 0.5
    nms_type: hard
    soft_nms_method: linear
    soft_nms_sigma: 0.5
    soft_nms_score_thresh: 0.001
    topk: null
    class_agnostic: true
    num_classes: 1
  model_cfg:
    in_channels: 1
    backbone:
      - [-1, 1, Conv, [64, 7, 2, 3]]
      - [-1, 1, nn.MaxPool2d, [3, 2, 1]]
      - [-1, 1, C2f, [64, false]]
      - [-1, 1, Conv, [128, 3, 2]]
      - [-1, 1, C2f, [128, false]]
      - [-1, 1, Conv, [256, 3, 2]]
      - [-1, 1, C2f, [256, false]]
    head:
      - [-1, 1, SPPF, [512, 5]]
      - [4, 1, Conv, [256, 1, 1]]
      - [7, 1, Conv, [256, 1, 1]]
      - [9, 1, nn.Upsample, [null, 2, nearest]]
      - [[8, 10], 1, Concat, [1]]
      - [-1, 1, C2f, [256, false]]
      - [[12, 7], 1, Detect, [512, true]]
      - [-1, 1, DetectDecode, [[{"name": "p2", "stride": 8}, {"name": "p3", "stride": 16}]]]
      - [-1, 1, DetectContract, []]

loss:
  type: YoloRTv2Criterion
  num_classes: 3
  loss_obj_weight: 1.0
  loss_box_weight: 5.0
  loss_obj_empty_factor: 0.25
  assigner: simota
  assign_radius: 1
  assign_use_inbox: false
  assign_area_weight: 0.05
  assign_force_one: true
  assign_force_max_radius: 6
  assign_force_level: 0
  assigner_cfg:
    type: SimOTAAssigner
    topk: 10
    center_radius: 2.5
    iou_weight: 3.0
    cls_weight: 1.0
    use_inbox: true
    use_center: true
    force_one: true
    force_level: 0